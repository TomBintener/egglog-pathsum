[package]
name = "egglog-experimental"
version = "0.1.0"
edition = "2024"
description = "Experimental extensions to the egglog language."
repository = "https://github.com/egraphs-good/egglog-experimental"
keywords = ["e-graphs", "egglog", "datalog", "compiler", "equality"]
license = "MIT"
readme = "README.md"

[[test]]
harness = false
name = "files"

[[bin]]
name = "profile_oracle"
path = "src/bin/profile_oracle.rs"

[[bin]]
name = "memory_benchmark"
path = "src/bin/memory_benchmark.rs"

# Disable the default benchmark harness to use criterion
[[bench]]
name = "boilerplate_benchmark"
harness = false

[[bench]]
name = "full_stack_benchmark"
harness = false

[features]
default = ["bin"]
bin = ["egglog/bin"]
dhat-heap = ["dhat"]
tracy = ["tracing-tracy", "tracing-subscriber"]

[dependencies]
egglog = { git = "https://github.com/saulshanabrook/egg-smol.git", branch = "fix-container-fn-bug", default-features = false }
egglog-ast = { git = "https://github.com/saulshanabrook/egg-smol.git", branch = "fix-container-fn-bug", default-features = false }
egglog-reports = { git = "https://github.com/saulshanabrook/egg-smol.git", branch = "fix-container-fn-bug", default-features = false }

num = "0.4.3"
lazy_static = "1.4"
log = "0.4"
smallvec = "1.13"
ordered-float = "4.2.0"

# For memory profiling (optional, enabled via feature)
dhat = { version = "0.3", optional = true }

# For FFI microsecond tracing (optional, enabled via feature)
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
tracing-tracy = { version = "0.11", optional = true }

rand = { version = "0.8", features = ["small_rng"] }

[dev-dependencies]
glob = "0.3.1"
libtest-mimic = "0.8.1"
criterion = "0.5"

[profile.release]
debug = true            # Keep debug symbols for the profiler
strip = false           # Do not strip symbols
opt-level = 3           # Maintain maximum performance